# OccupAI configuration: the documented example.
#
# Setup copies this file to data/occupai.config.yaml in the kit (gitignored, so your paths stay out of
# the repo; an older install's ~/.occupai/occupai.config.yaml still wins). The scan script and every prompt read it.
#
# Format: a plain YAML subset (maps, lists, quoted strings, comments). No anchors, no multi-line
# strings. The scan script parses it with the Python standard library only.
# Every key here is meant to be generated by a future `occupai init` (not built yet).

version: 1

# Where you cloned this kit (holds scan.py, prompts/, templates/). Skills and scheduled tasks use
# it to find the prompts and the scan script.
kit_path: ~/code/occupai

# --- Where your projects live -------------------------------------------------------------
# The local scan and the weekly audit look at every project under this folder (read only).
projects_root: ~/projects

# Folders to skip, as globs relative to projects_root. A folder can also opt out by containing
# an empty file named .occupai-ignore (useful for test fixtures with fake secrets).
exclusions:
  - "*/.claude/worktrees/*"     # agent worktrees are copies of repos you already scan
  - "backups*"
  - "archive*"
  - "*/node_modules/*"
  - "occupai"                   # this kit itself (its fixtures also carry .occupai-ignore)

# --- Ownership ----------------------------------------------------------------------------
# GitHub owners (users or orgs) whose repos are yours. Repos whose origin points at any other
# owner count as third-party clones: their findings are listed as info, not as actions.
# Leave empty and the scan lists every GitHub owner it sees for you to confirm.
my_owners:
  - your-github-username
  - your-github-org

# --- Your stack ---------------------------------------------------------------------------
# A starting point only: after the first local scan, the briefing answers "touches my stack?" from
# STORAGE/library/stack.md, which the scan writes from what your projects actually use.
stack:
  languages: [typescript, javascript, python]
  frameworks: [next.js, react]
  runtimes: [node, python]
  package_managers: [npm, pip]
  platforms: [github-actions, vercel, supabase, firebase]
  ai_tools: [claude-code, codex, mcp]

# --- News sources -------------------------------------------------------------------------
# Every run checks every group, and says in its report which sources it
# couldn't check. Prefer index pages sorted by date. Add, remove or reorder freely.
news_sources:
  campaigns_and_supply_chain:
    - name: Aikido
      url: https://www.aikido.dev/blog
    - name: Socket
      url: https://socket.dev/blog
    - name: StepSecurity
      url: https://www.stepsecurity.io/blog
    - name: Wiz
      url: https://www.wiz.io/blog
    - name: Snyk
      url: https://snyk.io/blog/
    - name: JFrog
      url: https://jfrog.com/blog/
    - name: Datadog Security Labs
      url: https://securitylabs.datadoghq.com/
    - name: Checkmarx
      url: https://checkmarx.com/blog/
    - name: GitHub Blog (security)
      url: https://github.blog/security/
    - name: GitHub Changelog
      url: https://github.blog/changelog/
    - name: GitHub Advisory Database (malware)
      url: https://github.com/advisories?query=type%3Amalware
  official:
    - name: CISA Known Exploited Vulnerabilities
      url: https://www.cisa.gov/known-exploited-vulnerabilities-catalog
    - name: NVD
      url: https://nvd.nist.gov/
    - name: JPCERT/CC
      url: https://www.jpcert.or.jp/english/
  stack_vendors:
    - name: Node.js security releases
      url: https://nodejs.org/en/blog/vulnerability
    - name: Next.js blog
      url: https://nextjs.org/blog
    - name: Vercel changelog
      url: https://vercel.com/changelog
    - name: React blog
      url: https://react.dev/blog
    - name: Supabase changelog
      url: https://supabase.com/changelog
    - name: Python security
      url: https://www.python.org/news/security/
    - name: Claude Code security advisories
      url: https://github.com/anthropics/claude-code/security/advisories
    - name: Model Context Protocol
      url: https://modelcontextprotocol.io/
    - name: OWASP GenAI Security Project
      url: https://genai.owasp.org/
  news:
    - name: The Hacker News
      url: https://thehackernews.com/
    - name: BleepingComputer
      url: https://www.bleepingcomputer.com/
  # Optional regional group, e.g. for Japan:
  # regional:
  #   - name: IPA
  #     url: https://www.ipa.go.jp/security/
  #   - name: JVN
  #     url: https://jvn.jp/

# --- Your computer -----------------------------------------------------------------------
# macOS, Windows or Linux: for the "Check on your computer" line. Set at setup, because a scheduled run
# may happen in a sandboxed shell with another OS. Empty = detect.
computer: ""

# --- Time and schedule --------------------------------------------------------------------
# An IANA timezone name. Report dates and "today" use it.
timezone: UTC

# Two scheduled tasks (cron syntax: minute hour day-of-month month day-of-week, in the timezone above).
# The briefing reads the news, updates the library and quick-matches new checks against your projects.
# The scan, after it, runs standing checks on new and changed projects and replays every check; on
# `full_day` it also refreshes every project and runs the dependency audit.
schedule:
  briefing: "52 7 * * *"   # a few minutes before the hour: on-the-hour runs can be delayed
  scan: "12 8 * * *"       # 20 minutes after the briefing
  full_day: monday

# --- Storage ------------------------------------------------------------------------------
# Plain files: briefings/, actioned.md (the tracker), library/, state/, howto.md.
# mode: local (default) or claude-project (see docs/storage.md; Claude Desktop only).
storage:
  path:              # empty: the folder holding this config (KIT/data, or ~/.occupai for older installs)
  mode: local
# State, progress and --out files are refused if they would land inside a scanned project. A storage
# folder under projects_root is fine only if it is listed in exclusions (or holds a .occupai-ignore file).

# --- Dependency audit -----------------------------------------------------------------------
# npm audit runs on a scratch copy of each lockfile with its own empty npm config: your ~/.npmrc,
# global npmrc, npm_config_* variables and tokens are never used. It talks to this registry only.
audit:
  npm_registry: https://registry.npmjs.org/

# --- Notifications ------------------------------------------------------------------------
# What the agent sends at the end of a run, if the tool supports it.
notifications:
  push: true            # a short push notification (top line + CRITICAL item names)
  max_chars: 200
  quiet_days: false     # false = no push when there's nothing new

# The briefing writes a shareable news brief (no project names, paths or findings); the scan writes a
# private to-do list. true = items that may affect you end with "→ see your to-do list" and the brief ends
# with "N of your projects may be affected". false = the brief gives no hint of which items affect you.
news_scorecard: true
