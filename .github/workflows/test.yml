name: test

on:
  push:
    branches: [main]
  pull_request:

# Follows the kit's own baseline: read-only token, actions pinned to full commit SHAs.
permissions:
  contents: read

jobs:
  test:
    # ubuntu-latest (26.04) has no Python 3.9; 24.04 keeps it, and setup supports 3.9+ (issue #17).
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Tests
        run: make test
      - name: Demo (offline)
        run: make demo
